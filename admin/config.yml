backend:
  name: github
  repo: thecotilking/dominion-group-of-schools
  branch: main
  # Must keep the www. The bare host 308s to www, so the OAuth popup ends
  # up on www while Decap still validates the postMessage origin against
  # this value — they stop matching, the message is discarded and login
  # hangs with no error. Fixed once in 17bafa9 and reverted by accident in
  # 9e18888; please don't drop the www again.
  base_url: https://www.dominiongroupofschools.com
  auth_endpoint: api/auth

media_folder: "assets/photos/news-uploads"
public_folder: "assets/photos/news-uploads"

collections:
  - name: "news"
    label: "News & Events"
    label_singular: "News Post"
    folder: "content/news"
    create: true
    delete: true
    slug: "{{slug}}"
    identifier_field: title
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime", format: "YYYY-MM-DD" }
      - { label: "Show in Spotlight", name: "spotlight", widget: "boolean", default: false, hint: "Featured in the scrolling highlight bar at the top of News" }
      - label: "Photos"
        name: "images"
        widget: "list"
        required: false
        field: { label: "Photo", name: "image", widget: "image" }
      - { label: "Summary", name: "body", widget: "text" }
